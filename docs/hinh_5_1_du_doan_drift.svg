<text x="320.0" y="591.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">⑤ So 24 đặc trưng với ngày tham chiếu</text>
<text x="320.0" y="607.0" text-anchor="middle" font-size="12" font-weight="400" fill="#444444">Evidently · tham chiếu = data_end của version @production</text>
<text x="320.0" y="623.0" text-anchor="middle" font-size="12" font-weight="400" fill="#444444">drift ratio = số cột lệch / 24 → none · medium · high · critical</text>
