[project]
name = "mlops"
version = "0.1.0"
description = "Reproducible synthetic margin propensity pipeline with Iceberg, point-in-time features, and quality gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.81",
    "duckdb>=1.5.5",
    "faker>=40.37.0",
    "mlflow>=3.15.2",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pyiceberg[sql-sqlite]>=0.12.0",
    "scikit-learn>=1.9.0",
]
