repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: minio
    url: https://charts.min.io/
  - name: community-charts
    url: https://community-charts.github.io/helm-charts
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/

helmDefaults:
  wait: true          # sync returns only when pods are Ready (MLflow 3 image is large: first pull takes minutes)
  timeout: 1200
  createNamespace: true

releases:
  - name: postgres
    namespace: mlops
    chart: bitnami/postgresql
    version: ~15.5.0
    values:
      - ./helm-values/postgres-values.yaml

  - name: redis
    namespace: mlops
    chart: bitnami/redis
    version: ~19.0.0
    values:
      - ./helm-values/redis-values.yaml

  - name: minio
    namespace: mlops
    chart: minio/minio
    version: ~5.2.0
    values:
      - ./helm-values/minio-values.yaml   # image must be preloaded into kind, see the file header

  - name: mlflow
    namespace: mlops
    chart: community-charts/mlflow
    # 1.11.6 = MLflow 3.15.2, same as the client in pyproject. 0.7.x shipped MLflow 2.1.1:
    # no model aliases (@staging/@production) and no MLflow 3 logged-model API.
    # Service port is 80 (chart 1.x), container port 5000.
    version: 1.11.6
    needs:            # backend DB and artifact bucket must exist before MLflow starts
      - mlops/postgres
      - mlops/minio
    values:
      - ./helm-values/mlflow-values.yaml

  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 10.10.5      # app v3.5.5
    values:
      - ./helm-values/argocd-values.yaml

  # Resource metrics API: KServe creates an HPA per InferenceService, which reads pod CPU from it
  # (without it the HPA is Degraded and `kubectl top` fails).
  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: 3.14.0       # app v0.9.0
    values:
      - ./helm-values/metrics-server-values.yaml
