releases:
  - name: postgres
    namespace: mlops
    chart: bitnami/postgresql
    version: ~15.5.0
    values:
      - ./helm-values/postgres-values.yaml

  - name: redis
    namespace: mlops
    chart: bitnami/redis
    version: ~19.0.0
    values:
      - ./helm-values/redis-values.yaml

  - name: minio
    namespace: mlops
    chart: minio/minio
    version: ~5.2.0
    values:
      - ./helm-values/minio-values.yaml

  - name: mlflow
    namespace: mlops
    chart: community-charts/mlflow
    version: ~0.7.0
    values:
      - ./helm-values/mlflow-values.yaml