# Airflow connection feature_store_db (env AIRFLOW_CONN_FEATURE_STORE_DB, see airflow-values.yaml): the Postgres
# database iceberg_catalog that holds control.fs_status. The <usecase>_predict DAGs poll it (SqlSensor).
# Demo credentials, same as postgres-values.yaml. Apply once: kubectl apply -f infra/bootstrap/airflow-connections-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: airflow-connections
  namespace: airflow
type: Opaque
stringData:
  feature_store_db: postgresql://postgres:mlflowpassword@postgres-postgresql.mlops.svc.cluster.local:5432/iceberg_catalog
