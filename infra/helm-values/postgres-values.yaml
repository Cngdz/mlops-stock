image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 16.4.0-debian-12-r14

# Cấu hình tài khoản và DB khởi tạo
auth:
  postgresPassword: "mlflowpassword"
  database: "mlflow"

# Cấu hình tài nguyên lưu trữ (PVC) và probes
primary:
  # Fresh volume only (initdb does not run again on an existing PVC; infra/README.md has the manual CREATE DATABASE):
  # iceberg_catalog = Iceberg catalog of gold/features/monitoring + control.fs_status, airflow = Airflow metadata.
  initdb:
    scripts:
      00-databases.sql: |
        CREATE DATABASE iceberg_catalog;
        CREATE DATABASE airflow;
  persistence:
    size: "2Gi"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 15


