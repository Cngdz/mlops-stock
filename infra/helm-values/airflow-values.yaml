# Airflow 2.10.5 in namespace airflow (chart apache-airflow/airflow 1.16.0).
# Before the first sync (infra/README.md, "Airflow in the cluster"):
#   - database `airflow` in the mlops Postgres
#   - Secret airflow/airflow-connections   (infra/bootstrap/airflow-connections-secret.yaml)
#   - Secret airflow/airflow-git-credentials (read-only token, only if the repo is private)
#   - RBAC for the task pods: pipeline/k8s/40-airflow-rbac.yaml
airflowVersion: "2.10.5"
defaultAirflowTag: "2.10.5"

# LocalExecutor: tasks run as subprocesses of the scheduler, and each of them only starts and watches a pod in
# namespace pipeline. No Celery workers, no Redis: the smallest footprint for a one-node lab.
executor: LocalExecutor
workers:
  persistence:
    enabled: false      # scheduler becomes a Deployment (deploy/airflow-scheduler)
triggerer:
  enabled: false        # no deferrable operators; the fs_status sensor uses mode=reschedule
redis:
  enabled: false
statsd:
  enabled: false

# Metadata DB in the existing Postgres (namespace mlops) instead of the chart's bundled one.
postgresql:
  enabled: false
data:
  metadataConnection:
    user: postgres
    pass: mlflowpassword       # demo credentials, same as mlflow-values.yaml
    protocol: postgresql
    host: postgres-postgresql.mlops.svc.cluster.local
    port: 5432
    db: airflow
    sslmode: disable

# DAGs come from Git: what is on master is what runs (no image rebuild, no copy into the pod).
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/Cngdz/mlops-stock.git
    branch: master
    rev: HEAD
    subPath: airflow/dags
    period: 60s
    # Keys GIT_SYNC_USERNAME, GIT_SYNC_PASSWORD, GITSYNC_USERNAME, GITSYNC_PASSWORD (git-sync v3 and v4 names).
    credentialsSecret: airflow-git-credentials

config:
  core:
    load_examples: "False"
    default_timezone: utc       # the UI shows UTC (docs 1.7); cron 0 23 * * * = 06:00 Vietnam
  webserver:
    workers: 1
  scheduler:
    dag_dir_list_interval: 60

env:
  # Read by airflow/dags/mlops.py: the pipeline image and its pull secret (namespace pipeline).
  - name: MLOPS_PIPELINE_IMAGE
    value: harbor.local/mlops/mlops-pipeline:v1    # <- your Harbor host
  - name: MLOPS_IMAGE_PULL_SECRET
    value: harbor-pull

secret:
  # Connection feature_store_db for the SqlSensor that waits for control.fs_status.
  - envName: AIRFLOW_CONN_FEATURE_STORE_DB
    secretName: airflow-connections
    secretKey: feature_store_db

webserver:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    password: admin            # demo only: change it, or create users with `airflow users create`
  service:
    type: ClusterIP            # kubectl -n airflow port-forward svc/airflow-webserver 8080:8080

scheduler:
  resources:
    requests: {memory: 512Mi}
    limits: {memory: 1536Mi}
