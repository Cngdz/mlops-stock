# quay.io/minio and Docker Hub minio/* no longer serve public images (401/denied), so the image is mirrored once
# into the cluster's Harbor (infra/README.md, "Images"):
#   docker tag minio/minio:RELEASE.2024-12-18T13-15-44Z harbor.local/mirror/minio:RELEASE.2024-12-18T13-15-44Z
#   docker push harbor.local/mirror/minio:RELEASE.2024-12-18T13-15-44Z
# The server image also ships `mc`, so the bucket job reuses it.
image:
  repository: harbor.local/mirror/minio    # <- your Harbor host
  tag: RELEASE.2024-12-18T13-15-44Z
  pullPolicy: IfNotPresent
mcImage:
  repository: harbor.local/mirror/minio
  tag: RELEASE.2024-12-18T13-15-44Z
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-pull

rootUser: minioadmin
rootPassword: minioadmin

mode: standalone

replicas: 1

# Bucket for MLflow artifacts (artifactRoot.s3.bucket in mlflow-values.yaml), created by the chart's post-install job
buckets:
  - name: mlflow
    policy: none
    purge: false
  # Day 13: Iceberg warehouse for in-cluster tables (predictions, drift, evaluation); catalog = Postgres db iceberg_catalog
  - name: warehouse
    policy: none
    purge: false

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m