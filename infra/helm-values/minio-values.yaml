# quay.io/minio and Docker Hub minio/* no longer serve public images (401/denied).
# Use the copy already in the local Docker cache, loaded into kind first:
#   kind load docker-image minio/minio:RELEASE.2024-12-18T13-15-44Z --name <cluster>
# The server image also ships `mc`, so the bucket job reuses it.
image:
  repository: minio/minio
  tag: RELEASE.2024-12-18T13-15-44Z
  pullPolicy: Never
mcImage:
  repository: minio/minio
  tag: RELEASE.2024-12-18T13-15-44Z
  pullPolicy: Never

rootUser: minioadmin
rootPassword: minioadmin

mode: standalone

replicas: 1

# Bucket for MLflow artifacts (artifactRoot.s3.bucket in mlflow-values.yaml), created by the chart's post-install job
buckets:
  - name: mlflow
    policy: none
    purge: false
  # Day 13: Iceberg warehouse for in-cluster tables (predictions, drift, evaluation); catalog = Postgres db iceberg_catalog
  - name: warehouse
    policy: none
    purge: false

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m