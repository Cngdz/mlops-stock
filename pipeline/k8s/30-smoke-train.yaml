# Smoke test: train in the cluster WITHOUT MLflow (--no-mlflow) to prove image + data + memory,
# without creating registry versions. Apply by hand, read the logs, delete.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-train
  namespace: pipeline
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: train
          image: harbor.local/mlops/mlops-pipeline:v1    # <- your Harbor host
          imagePullPolicy: Always
          command: ["python", "-m", "training.train", "--usecase", "loan_propensity", "--no-mlflow"]
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pipeline-data
