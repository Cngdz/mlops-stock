# Day 13 monitoring settings. Thresholds follow docs/timelinee/overview.md (monitoring section), which still marks
# them [TODO] pending mentor confirmation: change them here, not in code.

usecase: loan_propensity

drift:
  # Official reference = data_end tag of the @production versions (last labeled day they were tested on); it
  # moves with each promotion. This date is only the fallback for versions trained before that tag existed.
  reference_date: "2025-06-30"
  # Drift Ratio = drifted features / all model features (Evidently column-level result).
  # Upper bounds, inclusive: ratio 0 -> none, <= 0.20 -> medium, <= 0.50 -> high, above -> critical.
  severity:
    none: 0.0
    medium: 0.20
    high: 0.50
  # critical triggers retraining only when labels exist after the production data_end (otherwise the retrain
  # would see the same rows), and at most once per cooldown while new labels trickle in.
  retrain_cooldown_days: 7

evaluate:
  # Absolute drop of live ROC-AUC vs the AUC recorded at training (version tag test_roc_auc).
  warn_drop: 0.05
  retrain_drop: 0.10
